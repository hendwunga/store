<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background: #f5f7fa; display: flex; align-items: center; min-height: 100vh; }
      .login-card { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.12); padding: 2rem; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="login-card bg-white">
            <h3 class="text-center mb-4">Store Login</h3>
            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
            <form method="post" th:action="@{/login}">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
            <hr class="my-3" />
            <div class="small text-muted text-center">
              Demo: <strong>admin</strong> / <strong>admin123</strong><br />
              Demo: <strong>user</strong> / <strong>user123</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
