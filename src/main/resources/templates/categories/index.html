<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f5f7fa; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="#">📦 Store</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" th:href="@{/products}">Products</a>
          <span class="nav-link text-light" sec:authentication="name"></span>
          <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
      </div>
    </nav>

    <div class="container py-3">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Categories</h2>
        <a class="btn btn-success" th:href="@{/categories/create}">+ Add Category</a>
      </div>

      <div class="table-responsive" th:if="${categories != null && !#lists.isEmpty(categories)}">
        <table class="table table-bordered table-hover bg-white">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="cat : ${categories}">
              <td th:text="${cat.id}"></td>
              <td th:text="${cat.name}"></td>
              <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/categories/edit(id=${cat.id})}">Edit</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{/categories/delete(id=${cat.id})}"
                   onclick="return confirm('Delete category \'' + '${cat.name}' + '\'?')">Delete</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-center py-5" th:if="${categories == null || #lists.isEmpty(categories)}">
        <p class="text-muted">No categories yet.</p>
      </div>
    </div>
  </body>
</html>
