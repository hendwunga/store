<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f8f9fa; }
      .form-card { box-shadow: 0 4px 12px rgba(0,0,0,.15); border-radius: 12px; padding: 30px; margin-top: 40px; background: #fff; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="form-card">
            <h2 class="text-center mb-4">Edit Category</h2>
            <form th:object="${category}" method="post" th:action="@{/categories/edit(id=${category.id})}">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" th:field="*{name}" />
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
              </div>
              <div class="d-flex justify-content-between mt-4">
                <a class="btn btn-outline-secondary" href="/categories">Cancel</a>
                <button type="submit" class="btn btn-primary">Update</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
