<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Category - Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body class="bg-mesh">

  <nav class="navbar navbar-store sticky-top">
    <div class="container">
      <a class="navbar-brand" th:href="@{/products}">
        <span class="brand-icon">&#x1F6D2;</span>
        Store
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link" th:href="@{/categories}">&#x1F4C1; Categories</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="page-header animate-fadeIn">
      <h2>&#x270F;&#xFE0F; Edit Category</h2>
      <a class="btn-store btn-store-outline" th:href="@{/categories}">&#x2190; Back to Categories</a>
    </div>

    <div class="form-card animate-fadeIn" style="animation-delay:0.1s;max-width:640px">
      <form method="post" th:action="@{/categories/edit}" class="form-grid">
        <input type="hidden" name="id" th:value="${category.id}" />
        <div class="form-group form-group-full">
          <label class="form-label-store">Category Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control-store" required th:value="${category.name}" />
        </div>
        <div class="form-group-full d-flex gap-2 mt-2">
          <button type="submit" class="btn-store btn-store-primary">&#x2714;&#xFE0F; Update Category</button>
          <a class="btn-store btn-store-outline" th:href="@{/categories}">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
