<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" rel="stylesheet" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .error-box { text-align:center; max-width:420px; animation: fadeIn 0.6s ease-out; }
    .error-code { font-size:6rem; font-weight:800; background:var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
    .error-emoji { font-size:3rem; margin-bottom:1rem; }
  </style>
</head>
<body class="bg-mesh">
  <div class="error-box">
    <div class="error-emoji">&#x1F50D;</div>
    <div class="error-code">404</div>
    <h3 class="fw-bold mt-2">Page Not Found</h3>
    <p style="color:var(--gray-500)">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex gap-2 justify-content-center mt-4">
      <a class="btn-store btn-store-primary" th:href="@{/products}">&#x1F3E0; Back to Store</a>
    </div>
  </div>
</body>
</html>
