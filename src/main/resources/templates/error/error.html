<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Error - Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" rel="stylesheet" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .error-box { text-align:center; max-width:480px; animation: fadeIn 0.6s ease-out; }
    .error-code { font-size:6rem; font-weight:800; background:var(--gradient-danger); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
    .error-emoji { font-size:3rem; margin-bottom:1rem; }
    .error-detail { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); border-radius:0.75rem; padding:1rem; margin-top:1rem; text-align:left; font-size:0.8rem; color:var(--gray-600); word-break:break-all; }
  </style>
</head>
<body class="bg-mesh">
  <div class="error-box">
    <div class="error-emoji">&#x1F628;</div>
    <div class="error-code">500</div>
    <h3 class="fw-bold mt-2">Something Went Wrong</h3>
    <p style="color:var(--gray-500)">An unexpected error occurred. Please try again later.</p>
    <div th:if="${errorMessage}" class="error-detail">
      <strong>Error:</strong> <span th:text="${errorMessage}">Unknown error</span>
    </div>
    <div class="d-flex gap-2 justify-content-center mt-4">
      <a class="btn-store btn-store-primary" th:href="@{/products}">&#x1F3E0; Back to Store</a>
      <button class="btn-store btn-store-outline" onclick="location.reload()">&#x1F504; Retry</button>
    </div>
  </div>
</body>
</html>
