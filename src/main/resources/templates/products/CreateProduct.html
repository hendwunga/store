<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Product - Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body class="bg-mesh">

  <nav class="navbar navbar-store sticky-top">
    <div class="container">
      <a class="navbar-brand" th:href="@{/products}">
        <span class="brand-icon">&#x1F6D2;</span>
        Store
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link" th:href="@{/categories}">&#x1F4C1; Categories</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="page-header animate-fadeIn">
      <h2>&#x2795; Add Product</h2>
      <a class="btn-store btn-store-outline" th:href="@{/products}">&#x2190; Back to Products</a>
    </div>

    <div class="form-card animate-fadeIn" style="animation-delay:0.1s">
      <form method="post" th:action="@{/products/create}" enctype="multipart/form-data" class="form-grid">

        <div class="form-group">
          <label class="form-label-store">Product Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control-store" required placeholder="e.g. Running Shoes" />
        </div>

        <div class="form-group">
          <label class="form-label-store">Brand <span class="text-danger">*</span></label>
          <input type="text" name="brand" class="form-control-store" required placeholder="e.g. Nike" />
        </div>

        <div class="form-group">
          <label class="form-label-store">Category <span class="text-danger">*</span></label>
          <select name="categoryId" class="form-control-store" required>
            <option value="">-- Select Category --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label-store">Price (Rp) <span class="text-danger">*</span></label>
          <input type="number" name="price" class="form-control-store" required min="0" placeholder="e.g. 500000" />
        </div>

        <div class="form-group form-group-full">
          <label class="form-label-store">Description</label>
          <textarea name="description" class="form-control-store" rows="3" placeholder="Product description..."></textarea>
        </div>

        <div class="form-group form-group-full">
          <label class="form-label-store">Product Image</label>
          <div class="upload-area" onclick="document.getElementById('imageFile').click()">
            <input type="file" id="imageFile" name="imageFile" accept="image/*" class="d-none" onchange="previewImage(event,'imgPreview')" />
            <div id="uploadPlaceholder">
              <div style="font-size:2rem;margin-bottom:0.5rem">&#x1F4F7;</div>
              <p class="mb-0" style="color:var(--gray-500)">Click to upload image</p>
              <small style="color:var(--gray-400)">PNG, JPG, WEBP (max 5MB)</small>
            </div>
            <img id="imgPreview" src="#" alt="Preview" class="img-preview d-none" />
          </div>
        </div>

        <div class="form-group-full d-flex gap-2 mt-2">
          <button type="submit" class="btn-store btn-store-primary">&#x2714;&#xFE0F; Save Product</button>
          <a class="btn-store btn-store-outline" th:href="@{/products}">Cancel</a>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
