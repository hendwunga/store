<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Product - Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>
<body class="bg-mesh">

  <nav class="navbar navbar-store sticky-top">
    <div class="container">
      <a class="navbar-brand" th:href="@{/products}">
        <span class="brand-icon">&#x1F6D2;</span>
        Store
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link" th:href="@{/categories}">&#x1F4C1; Categories</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="page-header animate-fadeIn">
      <h2>&#x270F;&#xFE0F; Edit Product</h2>
      <a class="btn-store btn-store-outline" th:href="@{/products}">&#x2190; Back to Products</a>
    </div>

    <div class="form-card animate-fadeIn" style="animation-delay:0.1s">
      <form method="post" th:action="@{/products/edit}" enctype="multipart/form-data" class="form-grid">
        <input type="hidden" name="id" th:value="${product.id}" />

        <div class="form-group">
          <label class="form-label-store">Product Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control-store" required th:value="${product.name}" />
        </div>

        <div class="form-group">
          <label class="form-label-store">Brand <span class="text-danger">*</span></label>
          <input type="text" name="brand" class="form-control-store" required th:value="${product.brand}" />
        </div>

        <div class="form-group">
          <label class="form-label-store">Category <span class="text-danger">*</span></label>
          <select name="categoryId" class="form-control-store" required>
            <option value="">-- Select Category --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                    th:selected="${product.category != null && product.category.id == cat.id}">Category</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label-store">Price (Rp) <span class="text-danger">*</span></label>
          <input type="number" name="price" class="form-control-store" required min="0" th:value="${product.price}" />
        </div>

        <div class="form-group form-group-full">
          <label class="form-label-store">Description</label>
          <textarea name="description" class="form-control-store" rows="3" th:text="${product.description}"></textarea>
        </div>

        <div class="form-group form-group-full">
          <label class="form-label-store">Product Image</label>
          <div class="upload-area" onclick="document.getElementById('imageFile').click()">
            <input type="file" id="imageFile" name="imageFile" accept="image/*" class="d-none" onchange="previewImage(event,'imgPreview')" />
            <div id="uploadPlaceholder">
              <img th:if="${product.imageFileName != null}" th:src="${product.imageFileName}" class="img-preview mb-2" style="max-height:120px;border-radius:0.5rem" />
              <p class="mb-0" style="color:var(--gray-500)">Click to change image</p>
              <small style="color:var(--gray-400)">Current image will be kept if no new file selected</small>
            </div>
            <img id="imgPreview" src="#" alt="Preview" class="img-preview d-none" />
          </div>
        </div>

        <div class="form-group-full d-flex gap-2 mt-2">
          <button type="submit" class="btn-store btn-store-primary">&#x2714;&#xFE0F; Update Product</button>
          <a class="btn-store btn-store-outline" th:href="@{/products}">Cancel</a>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
