openapi: 3.0.3
info:
  title: Store API
  description: |
    REST API untuk manajemen produk dan kategori pada aplikasi Store.
    
    ## Autentikasi
    - **REST API** (`/api/**`): Dapat diakses tanpa autentikasi (public).
    - **MVC Pages** (`/products`, `/categories`): Memerlukan login.
      - `USER`: Hanya dapat melihat produk (read-only).
      - `ADMIN`: Dapat melakukan CRUD pada produk dan kategori.
    
    ## Upload Gambar
    - Endpoint REST API menggunakan `imageUrl` (string URL) untuk gambar.
    - Endpoint MVC mendukung `multipart/form-data` untuk upload file.
    - Gambar disimpan di Cloudinary (production) atau lokal (development).
    
    ## Format Response
    Semua endpoint mengembalikan response dalam format:
    ```json
    {
      "success": true/false,
      "message": "Deskripsi pesan",
      "data": { ... }
    }
    ```
    
    ## Base URL
    - **Local**: `http://localhost:8080`
    - **Staging**: Aiven MySQL (database dummy)
    - **Production**: Aiven MySQL (database asli)
  version: 1.1.1
  contact:
    name: Hend Wunga
    email: hend@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://bon-awareness-sublime-adapted.trycloudflare.com
    description: Staging Server (Cloudflare Tunnel → Aiven MySQL)

tags:
  - name: Products
    description: CRUD operasi untuk produk
  - name: Categories
    description: CRUD operasi untuk kategori

security:
  - basicAuth: []

paths:
  /api/products:
    get:
      tags: [Products]
      summary: List semua produk
      description: Mengembalikan daftar semua produk. Supports pencarian berdasarkan nama atau brand.
      operationId: getAllProducts
      parameters:
        - name: search
          in: query
          description: Kata kunci pencarian (opsional)
          required: false
          schema:
            type: string
            example: "macbook"
      responses:
        "200":
          description: Berhasil mengambil data produk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
              example:
                success: true
                message: "Products retrieved successfully"
                data:
                  - id: 1
                    name: "MacBook Pro 14 inch"
                    brand: "Apple"
                    price: 19999000

    post:
      tags: [Products]
      summary: Buat produk baru
      description: Membuat produk baru dengan data yang dikirimkan
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Produk berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Validasi gagal atau kategori tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Category with id 99 not found"
                data: null

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Detail satu produk
      description: Mengembalikan detail produk berdasarkan ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          description: ID produk
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        "200":
          description: Produk ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Product with id 99 not found"
                data: null

    put:
      tags: [Products]
      summary: Update produk
      description: Mengupdate data produk berdasarkan ID
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          description: ID produk
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Produk berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Products]
      summary: Hapus produk
      description: Menghapus produk berdasarkan ID
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          description: ID produk
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        "200":
          description: Produk berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidResponse"
        "404":
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/categories:
    get:
      tags: [Categories]
      summary: List semua kategori
      description: Mengembalikan daftar semua kategori yang tersedia
      operationId: getAllCategories
      responses:
        "200":
          description: Berhasil mengambil data kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

    post:
      tags: [Categories]
      summary: Buat kategori baru
      description: Membuat kategori baru. Kategori nama harus unik.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "201":
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Nama kategori sudah ada atau validasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Category name may already exist"
                data: null

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Detail satu kategori
      description: Mengembalikan detail kategori berdasarkan ID
      operationId: getCategoryById
      parameters:
        - name: id
          in: path
          description: ID kategori
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        "200":
          description: Kategori ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: Kategori tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Categories]
      summary: Update kategori
      description: Mengupdate nama kategori berdasarkan ID. Nama harus unik.
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          description: ID kategori
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: Kategori berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: Kategori tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Nama kategori sudah ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Categories]
      summary: Hapus kategori
      description: Menghapus kategori berdasarkan ID
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          description: ID kategori
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        "200":
          description: Kategori berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidResponse"
        "404":
          description: Kategori tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication (username:password)

  schemas:
    ProductRequest:
      type: object
      description: Request body untuk membuat atau mengupdate produk
      required:
        - name
        - brand
        - categoryId
        - price
        - description
      properties:
        name:
          type: string
          description: Nama produk
          minLength: 1
          example: "MacBook Pro 14 inch"
        brand:
          type: string
          description: Merek produk
          minLength: 1
          example: "Apple"
        categoryId:
          type: integer
          description: ID kategori produk
          minimum: 1
          example: 1
        price:
          type: number
          format: double
          description: Harga produk (minimal 0)
          minimum: 0
          example: 19999000
        description:
          type: string
          description: Deskripsi produk (10-2000 karakter)
          minLength: 10
          maxLength: 2000
          example: "MacBook Pro 14 inch dengan chip M3 Pro untuk produktivitas"
        imageUrl:
          type: string
          format: uri
          description: URL gambar produk (opsional)
          example: "https://example.com/macbook.jpg"

    CategoryRequest:
      type: object
      description: Request body untuk membuat atau mengupdate kategori
      required:
        - name
      properties:
        name:
          type: string
          description: Nama kategori (harus unik)
          minLength: 1
          example: "Elektronik"

    Product:
      type: object
      description: Entity produk
      properties:
        id:
          type: integer
          readOnly: true
          description: ID produk (auto-generated)
          example: 1
        name:
          type: string
          description: Nama produk
          example: "MacBook Pro 14 inch"
        brand:
          type: string
          description: Merek produk
          example: "Apple"
        category:
          $ref: "#/components/schemas/Category"
        price:
          type: number
          format: double
          description: Harga produk
          example: 19999000
        description:
          type: string
          description: Deskripsi produk
          example: "MacBook Pro 14 inch dengan chip M3 Pro untuk produktivitas"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Waktu pembuatan (auto-generated)
          example: "2026-01-15T10:30:00"
        imageFileName:
          type: string
          nullable: true
          description: URL/nama file gambar
          example: "https://res.cloudinary.com/demo/image/upload/sample.jpg"

    Category:
      type: object
      description: Entity kategori
      properties:
        id:
          type: integer
          readOnly: true
          description: ID kategori (auto-generated)
          example: 1
        name:
          type: string
          description: Nama kategori
          example: "Elektronik"

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Product retrieved successfully"
        data:
          $ref: "#/components/schemas/Product"

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Products retrieved successfully"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Category retrieved successfully"
        data:
          $ref: "#/components/schemas/Category"

    CategoryListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Categories retrieved successfully"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    VoidResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Deleted successfully"
        data:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Resource not found"
        data:
          type: object
          nullable: true
          example: null
